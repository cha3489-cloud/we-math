<!doctype html><html lang=ko><head><meta charset=UTF-8><meta name=viewport content='width=device-width, initial-scale=1'><meta name=robots content=noindex><meta name=referrer content=no-referrer><meta name=theme-color content=#173f3a><title>보강 일정 선택 | 시퀀스 수학</title></head><body class=makeup-app><main class=makeup>
<header class=makeup-header><span class=brand-mark aria-hidden=true>S</span><h1>보강 일정 선택</h1></header>
<section class=makeup-panel aria-labelledby=makeupTitle>
  <h2 id=makeupTitle>학원에서 제안한 시간 중 하나를 선택해 주세요</h2>
  <p id=makeupStudent class=makeup-meta></p>
  <p id=makeupDeadline class=makeup-meta></p>
  <form id=makeupForm hidden>
    <fieldset><legend>보강 가능 시간</legend><div id=makeupOptions class=makeup-options></div></fieldset>
    <button id=makeupSubmit type=submit>이 시간으로 선택</button>
  </form>
  <p id=makeupStatus class=makeup-status role=status aria-live=polite>불러오는 중입니다.</p>
</section>
</main><script type=module src=/src/makeup/main.js></script></body></html>
