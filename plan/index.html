<!doctype html><html lang=ko><head><meta charset=UTF-8><meta name=viewport content='width=device-width, initial-scale=1, viewport-fit=cover'><meta name=robots content=noindex><meta name=referrer content=no-referrer><meta name=theme-color content=#173f3a><title>오늘 학습 계획 | 시퀀스 수학</title></head><body class=plan-app><main class=plan>
<header class=plan-header><span class=brand-mark aria-hidden=true>S</span><h1 id=planHeading tabindex=-1>시퀀스 수학 오늘 학습</h1></header>

<section id=planSetup class=plan-panel hidden aria-labelledby=planSetupTitle>
  <h2 id=planSetupTitle>학습계획 태블릿 등록</h2>
  <p>관리자 화면에서 발급한 학습계획 태블릿 등록 코드를 붙여 넣어 주세요. 학원 전용 태블릿에서만 사용하세요. 출석번호나 학생 비밀번호는 입력하지 않습니다.</p>
  <form id=planSetupForm novalidate>
    <label for=planSetupToken>기기 등록 코드</label>
    <input id=planSetupToken type=password autocomplete=off autocapitalize=off spellcheck=false inputmode=text aria-describedby=planSetupError required>
    <button type=submit class=plan-primary>등록</button>
    <p id=planSetupError class=plan-error role=alert></p>
  </form>
</section>

<section id=planView class=plan-panel hidden aria-labelledby=planDate>
  <h2 id=planDate class=plan-date></h2>
  <div id=planStatus class=plan-status role=status aria-live=polite hidden>
    <p id=planStatusTitle class=plan-status-title></p>
    <p id=planStatusDetail class=plan-status-detail></p>
  </div>
  <ol id=planItems class=plan-items aria-live=polite></ol>
  <p id=planNote class=plan-note role=status aria-live=polite></p>
  <details class=plan-device-menu><summary>기기 관리</summary>
    <p>이 태블릿을 더 이상 학습계획용으로 쓰지 않을 때만 연결을 해제하세요.</p>
    <button id=planClearDevice type=button class=plan-secondary>이 기기 연결 해제</button>
  </details>
</section>
</main><script type=module src=/src/plan/main.js></script></body></html>
