<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="">
  <!-- 시퀀스 수학 · 과제 없음 빈 상태 (정사각형) · 글자 없음 · 배경 투명
       cream #F7F4ED · navy #173F3A · mint #BFE7D7 · coral #D9674F -->

  <!-- 은은한 크림 원 (투명 배경 위에 놓이는 받침) -->
  <circle cx="256" cy="264" r="196" fill="#F7F4ED"/>

  <!-- 차분히 정리된 학습지 한 장 -->
  <g transform="rotate(-5 256 264)">
    <rect x="156" y="150" width="200" height="248" rx="16" fill="#FFFFFF" fill-opacity=".6" stroke="#173F3A" stroke-width="7"/>
    <line x1="218" y1="206" x2="326" y2="206" stroke="#173F3A" stroke-width="7" stroke-linecap="round" opacity=".5"/>
    <line x1="218" y1="262" x2="308" y2="262" stroke="#173F3A" stroke-width="7" stroke-linecap="round" opacity=".5"/>
    <line x1="218" y1="318" x2="320" y2="318" stroke="#173F3A" stroke-width="7" stroke-linecap="round" opacity=".5"/>
    <!-- 모두 마친 표시: 민트 체크 -->
    <circle cx="190" cy="206" r="17" fill="#BFE7D7"/>
    <path d="M182 206 l6 7 l11 -13" stroke="#173F3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="190" cy="262" r="17" fill="#BFE7D7"/>
    <path d="M182 262 l6 7 l11 -13" stroke="#173F3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="190" cy="318" r="17" fill="#BFE7D7"/>
    <path d="M182 318 l6 7 l11 -13" stroke="#173F3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 쉼표처럼 떠 있는 민트 점들 (다음 반복을 기다리는 여백) -->
  <circle cx="392" cy="150" r="10" fill="#BFE7D7"/>
  <circle cx="120" cy="192" r="7"  fill="#BFE7D7" opacity=".75"/>
  <circle cx="372" cy="392" r="7"  fill="#BFE7D7" opacity=".75"/>

  <!-- 아주 작은 코랄 포인트 하나 -->
  <circle cx="414" cy="330" r="8" fill="#D9674F"/>

  <!-- 앞으로 이어질 점선 한 조각 -->
  <path d="M118 372 C 140 396, 168 410, 200 416"
        stroke="#BFE7D7" stroke-width="6" stroke-linecap="round" stroke-dasharray="1 18"/>
</svg>
