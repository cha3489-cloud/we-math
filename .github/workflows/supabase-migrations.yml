name: Supabase migrations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run 또는 apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply
      confirm:
        description: "apply 실행 시 APPLY 입력. dry-run은 비워둬도 됩니다."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: supabase-migrations-tcpitbsrfouwmfkkdqhg
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.mode }} Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: tcpitbsrfouwmfkkdqhg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite before touching the database
        run: npm test

      - name: Check required secrets
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing GitHub secret: SUPABASE_ACCESS_TOKEN" >&2
            exit 1
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Missing GitHub secret: SUPABASE_DB_PASSWORD" >&2
            exit 1
          fi

      - name: Show pending migrations (dry run)
        run: |
          set -euo pipefail
          npx supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run

      - name: Apply migrations
        if: ${{ inputs.mode == 'apply' }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "APPLY" ]; then
            echo "To apply migrations, rerun with mode=apply and confirm=APPLY" >&2
            exit 1
          fi
          npx supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Next step
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            echo "Dry run only. If the pending migration list is correct, rerun this workflow with mode=apply and confirm=APPLY."
          else
            echo "Apply step completed. Share this workflow run log for post-migration verification."
          fi
