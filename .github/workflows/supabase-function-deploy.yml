name: Deploy consultation intake function

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/consultation-intake/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      restore_inactive:
        description: '중지된 프로젝트를 명시적으로 복구한 뒤 배포'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-function-consultation-intake
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tcpitbsrfouwmfkkdqhg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify domain and edge function types
        run: |
          npm test -- --run tests/consultation-intake.test.js tests/habit-diagnostic.test.js
          npx --yes deno check supabase/functions/consultation-intake/index.ts
      - name: Check deployment credential
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
      - name: Restore inactive project when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.restore_inactive == true }}
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF"
          auth="Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          status="$(curl -fsS -H "$auth" "$api" | jq -r '.status')"
          if [ "$status" = "INACTIVE" ]; then
            curl -fsS -X POST -H "$auth" "$api/restore" >/dev/null
          fi
          for attempt in $(seq 1 80); do
            status="$(curl -fsS -H "$auth" "$api" | jq -r '.status')"
            echo "Project status: $status"
            if [ "$status" = "ACTIVE_HEALTHY" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Project did not become healthy before timeout" >&2
          exit 1
      - name: Deploy consultation-intake
        run: |
          npx supabase functions deploy consultation-intake \
            --project-ref "$SUPABASE_PROJECT_REF"
