name: Deploy operations edge functions

# Deploys attendance-code and parent-message-dispatch only after a merge to main (or an explicit
# manual dispatch), and only after the full test suite and Deno type checks pass.
# ATTENDANCE_CODE_HMAC_SECRET is created once (openssl rand, 48 bytes) only when the secret name is
# absent, passed to Supabase via a 0600 mktemp --env-file (removed on exit), never rotated, and never printed or exported. Existence is
# verified by name. PARENT_MESSAGE_PROVIDER is untouched (code default stays dry_run).
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/attendance-code/**'
      - 'supabase/functions/parent-message-dispatch/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-operations-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-operations-functions
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run test suite
        run: npm test
      - name: Type-check edge functions
        run: |
          set -euo pipefail
          npx --yes deno check supabase/functions/attendance-code/index.ts
          npx --yes deno check supabase/functions/parent-message-dispatch/index.ts

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: tcpitbsrfouwmfkkdqhg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check deployment credential
        run: |
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo 'Missing SUPABASE_ACCESS_TOKEN' >&2; exit 1; }
      - name: Bootstrap attendance HMAC function secret (first run only)
        run: |
          set +x
          set -euo pipefail
          list_names() {
            npx supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" -o json | jq -r '.[].name'
          }
          names="$(list_names)"
          if ! grep -qx 'ATTENDANCE_CODE_HMAC_SECRET' <<<"$names"; then
            secret_file=""
            trap 'rm -f "$secret_file"; unset ATTENDANCE_CODE_HMAC_SECRET' EXIT
            secret_file="$(mktemp)"
            chmod 600 "$secret_file"
            ATTENDANCE_CODE_HMAC_SECRET="$(openssl rand -base64 48)"
            printf 'ATTENDANCE_CODE_HMAC_SECRET=%s\n' "$ATTENDANCE_CODE_HMAC_SECRET" > "$secret_file"
            unset ATTENDANCE_CODE_HMAC_SECRET
            npx supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secret_file" >/dev/null 2>&1 || {
              echo 'Failed to register ATTENDANCE_CODE_HMAC_SECRET (output suppressed)' >&2
              exit 1
            }
            rm -f "$secret_file"
            names="$(list_names)"
            if ! grep -qx 'ATTENDANCE_CODE_HMAC_SECRET' <<<"$names"; then
              echo 'ATTENDANCE_CODE_HMAC_SECRET is still missing after registration; refusing to deploy' >&2
              exit 1
            fi
            echo 'ATTENDANCE_CODE_HMAC_SECRET created and verified by name'
          else
            echo 'ATTENDANCE_CODE_HMAC_SECRET already present; left unchanged'
          fi
      - name: Deploy attendance-code
        run: |
          npx supabase functions deploy attendance-code \
            --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy parent-message-dispatch
        run: |
          npx supabase functions deploy parent-message-dispatch \
            --project-ref "$SUPABASE_PROJECT_REF"
